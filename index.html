<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiboPay</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="container mt-5">
    <h1 class="text-center">💸 FiboPay PRO</h1>

    <div class="card p-4">
        <div class="row g-3">
            <div class="col-md-3">
                <input type="number" id="valor" class="form-control" placeholder="Valor">
            </div>

            <div class="col-md-3">
                <input type="number" id="parcelas" class="form-control" placeholder="Parcelas">
            </div>

            <div class="col-md-3">
                <input type="number" id="juros" class="form-control" placeholder="Juros %">
            </div>

            <div class="col-md-3">
                <select id="modo" class="form-control">
                    <option value="crescente">Crescente</option>
                    <option value="decrescente">Decrescente</option>
                </select>
            </div>
        </div>

        <button id="btnCalcular" class="btn btn-primary mt-3 w-100">
            Calcular
        </button>

        <button id="exportar" class="btn btn-success mt-2 w-100">
            Exportar PDF
        </button>
    </div>

    <table class="table mt-4">
        <tbody id="resultado"></tbody>
    </table>

    <canvas id="grafico"></canvas>

    <ul id="historico" class="list-group mt-4"></ul>

    <button id="limpar" class="btn btn-danger mt-2 w-100">
        Limpar Histórico
    </button>
</div>

<script src="script.js"></script>
</body>
</html>
